[project]
name = "datadiffusion"
dynamic = ["version"]
description = "Tabular synthetic data with denoising diffusion (DDPM/DDIM), evaluated honestly against baselines."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.13"
authors = [{ name = "Juan Garassino" }]
dependencies = [
    "torch==2.2.2",        # last macOS x86_64 wheel; CPU wheels on linux via the pytorch-cpu index
    "numpy>=1.24,<2",      # torch 2.2.2 is built against numpy 1.x
    "scikit-learn>=1.4",   # datasets, QuantileTransformer, gradient boosting for C2ST/TSTR
]

[project.optional-dependencies]
plots = ["matplotlib>=3.8"]
dev = ["pytest>=7.2", "ruff>=0.6", "matplotlib>=3.8"]

[project.scripts]
datadiffusion = "datadiffusion.cli:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "datadiffusion/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["datadiffusion"]

[tool.uv]
environments = [
    "sys_platform == 'darwin'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]
markers = ["slow: trains for more than a few seconds or needs the California Housing download"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]
