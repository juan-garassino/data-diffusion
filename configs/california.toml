# datadiffusion train --config configs/california.toml
name = "california"

[data]
dataset = "california"
seed = 0
holdout_fraction = 0.15
test_fraction = 0.15

[model]
hidden_size = 256
num_layers = 4
dropout = 0.0
time_embed_dim = 128

[diffusion]
num_timesteps = 1000
schedule = "cosine"

[train]
epochs = 300
batch_size = 256
lr = 1e-3
warmup_steps = 500
ema_decay = 0.999
patience = 40
seed = 0
